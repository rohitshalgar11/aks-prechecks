# Read-only access for the pre-check identity. Apply once per cluster.
#
# Why cluster-wide read: kubent inspects many API kinds across every namespace and reads
# Helm release secrets to find old APIs inside charts. If reading secrets is not
# acceptable, replace the wildcard rule with explicit resources and run kubent with
# --helm3=false (you then lose Helm-release scanning).
#
# This applies to AKS with Entra ID + Kubernetes RBAC. If your cluster uses
# *Azure RBAC for Kubernetes authorization*, skip this file and assign the identity a
# custom Azure role with the equivalent read actions instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-precheck-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-precheck-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-precheck-reader
subjects:
  # Entra ID group containing the OIDC app registration / managed identity
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "<ENTRA_GROUP_OBJECT_ID>"
