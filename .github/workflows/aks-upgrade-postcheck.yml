name: AKS upgrade post-check

# Runs after an upgrade: verifies the upgrade finished, waits for workloads to settle,
# re-runs every pre-check scan and compares the result with the pre-check baseline.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which clusters to check
        type: choice
        options: [dev, uat, prod, all]
        default: dev
      precheck_run_id:
        description: Run ID of the pre-check to compare against (empty = latest pre-check per cluster)
        type: string
        required: false
      settle_minutes:
        description: Max minutes to wait for previously healthy workloads to recover
        type: number
        default: 15
      fail_on_regressions:
        description: Fail the run if the upgrade is incomplete or broke something
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      precheck_run_id: { type: string, required: false, default: "" }
      settle_minutes: { type: number, required: false, default: 15 }
      fail_on_regressions: { type: boolean, required: false, default: true }

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  actions: read     # download the pre-check artifact from another run

concurrency:
  group: aks-postcheck-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select clusters
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ENV_FILTER: ${{ inputs.environment }}
        run: |
          matrix=$(jq -c --arg e "$ENV_FILTER" \
            '[.clusters[] | select($e == "all" or .env == $e)]' config/clusters.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error::No clusters in config/clusters.json for environment '$ENV_FILTER'"; exit 1
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  postcheck:
    name: postcheck (${{ matrix.name }})
    needs: plan
    runs-on: [self-hosted, linux, aks-precheck]
    environment: precheck-${{ matrix.env }}   # same read-only identity as the pre-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      BASE_DIR: ${{ github.workspace }}/baseline/${{ matrix.name }}
      OUT_DIR: ${{ github.workspace }}/out/${{ matrix.name }}
      RAW: ${{ github.workspace }}/out/${{ matrix.name }}/raw
      RG: ${{ matrix.resourceGroup }}
      CLUSTER: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Find pre-check baseline
        id: baseline
        uses: actions/github-script@v7
        env:
          ARTIFACT: precheck-${{ matrix.name }}
          RUN_ID: ${{ inputs.precheck_run_id }}
        with:
          script: |
            const name = process.env.ARTIFACT;
            if (process.env.RUN_ID) {
              core.setOutput('run_id', process.env.RUN_ID);
              return;
            }
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, name, per_page: 50 });
            const latest = data.artifacts
              .filter(a => !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!latest) {
              core.setFailed(`No ${name} artifact found. Run the pre-check before upgrading.`);
              return;
            }
            core.info(`Baseline: ${name} from run ${latest.workflow_run.id}, created ${latest.created_at}`);
            core.setOutput('run_id', String(latest.workflow_run.id));

      - name: Download pre-check baseline
        uses: actions/download-artifact@v4
        with:
          name: precheck-${{ matrix.name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.BASE_DIR }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ matrix.subscriptionId }}

      - name: Ensure tools
        run: bash scripts/install-tools.sh

      - name: Get cluster credentials
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig-$CLUSTER"
          az aks get-credentials -g "$RG" -n "$CLUSTER" --file "$KUBECONFIG" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli --kubeconfig "$KUBECONFIG"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - name: Wait for workloads to settle
        run: |
          python scripts/precheck.py wait-settle --baseline-dir "$BASE_DIR" \
            --timeout-min "${{ inputs.settle_minutes }}" --config config/precheck.json

      - name: Collect AKS metadata
        run: |
          mkdir -p "$RAW"
          az aks show          -g "$RG" -n "$CLUSTER"            -o json > "$RAW/cluster.json"
          az aks get-upgrades  -g "$RG" -n "$CLUSTER"            -o json > "$RAW/upgrades.json"
          az aks nodepool list -g "$RG" --cluster-name "$CLUSTER" -o json > "$RAW/nodepools.json"

      - name: Current version
        id: cur
        run: echo "version=$(python -c "import json;d=json.load(open('$RAW/cluster.json'));print(d.get('currentKubernetesVersion') or d['kubernetesVersion'])")" >> "$GITHUB_OUTPUT"

      - name: Scan removed APIs (kubent)
        run: |
          kubent --target-version "${{ steps.cur.outputs.version }}" \
                 --output json --log-level warn > "$RAW/kubent.json"

      - name: Read runtime deprecated-API metric
        run: |
          kubectl get --raw /metrics 2> "$RAW/metrics.err" \
            | grep '^apiserver_requested_deprecated_apis' > "$RAW/deprecated-api-metrics.txt" || true

      - name: Scan cluster (same checks as the pre-check)
        run: |
          python scripts/precheck.py scan \
            --cluster-name "$CLUSTER" --env "${{ matrix.env }}" \
            --target "${{ steps.cur.outputs.version }}" \
            --cluster-json "$RAW/cluster.json" --upgrades-json "$RAW/upgrades.json" \
            --nodepools-json "$RAW/nodepools.json" --kubent-json "$RAW/kubent.json" \
            --metrics-file "$RAW/deprecated-api-metrics.txt" --metrics-err "$RAW/metrics.err" \
            --config config/precheck.json --out-dir "$OUT_DIR"

      - name: Compare with pre-check
        id: compare
        run: |
          python scripts/precheck.py compare \
            --baseline-dir "$BASE_DIR" --post-dir "$OUT_DIR" \
            --cluster-json "$RAW/cluster.json" --nodepools-json "$RAW/nodepools.json" \
            --cluster-name "$CLUSTER" --env "${{ matrix.env }}"
          cat "$OUT_DIR/postcheck-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcheck-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}
            baseline/${{ matrix.name }}/report.json
          retention-days: 90

      - name: Gate on regressions
        if: >-
          inputs.fail_on_regressions &&
          (steps.compare.outputs.verification_failures != '0' || steps.compare.outputs.regressions != '0')
        run: |
          echo "::error::$CLUSTER: upgrade incomplete (${{ steps.compare.outputs.verification_failures }}) or regressions found (${{ steps.compare.outputs.regressions }}). See the post-check report."
          exit 1

  summary:
    name: Summary
    needs: postcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: postcheck-*
          path: reports
      - name: Combined summary
        run: python3 scripts/precheck.py summary --kind post --reports-dir reports >> "$GITHUB_STEP_SUMMARY"
